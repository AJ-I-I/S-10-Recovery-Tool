[package]
name = "s10-recovery-tool"
version = "0.1.0"
edition = "2024"
authors = ["JONES"]

[dependencies]
# TUI Framework
ratatui = "0.27"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Filesystem and disk access
walkdir = "2"
memmap2 = "0.9"

# Platform-specific dependencies
[target.'cfg(windows)'.dependencies]
winapi = { version = "0.3", features = ["winbase", "fileapi", "winioctl", "winnt"] }

# Cryptography and hashing
sha2 = "0.10"
md5 = "0.7"
digest = "0.10"
crc32fast = "1"
aes = "0.8"
cipher = "0.4"

# File format parsing
byteorder = "1"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
csv = "1"

# Error handling
anyhow = "1"
thiserror = "1"

# Utilities
clap = { version = "4", features = ["derive"] }
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5"  # For config directories
hex = "0.4"  # For hex encoding/decoding

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true


